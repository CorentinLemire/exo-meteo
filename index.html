<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>meteo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-primary text-white m-0 p-0" style="min-height: 100vh;">

    <div class="container-fluid d-flex flex-column justify-content-between py-4" style="min-height: 100vh;">
        <div class="text-center mb-4">
            <input type="text" id="cityInput" placeholder="Entrez une ville" class="form-control w-75 mx-auto">
            <a class="btn btn-danger mt-2" data-bs-toggle="offcanvas" href="#offcanvasExample" role="button"
                aria-controls="offcanvasExample" onclick="displayFavorites()">
                <i class="bi bi-star-fill"></i> favoris


                <div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvasExample"
                    aria-labelledby="offcanvasExampleLabel">
                    <div class="offcanvas-header">
                        <h5 class="offcanvas-title" id="offcanvasExampleLabel"><i class="bi bi-star-fill"></i>favoris
                        </h5>
                        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
                    </div>
                    <div class="offcanvas-body">

                        <div class="dropdown mt-3">

                            <ul class="dropdown-menu">
                                <li><a class="dropdown-item" href="#">Action</a></li>
                                <li><a class="dropdown-item" href="#">Another action</a></li>
                                <li><a class="dropdown-item" href="#">Something else here</a></li>
                            </ul>
                        </div>
                    </div>
                </div>

                <button onclick="getWeather()" class="btn btn-light mt-2">Voir la météo</button>
        </div>
        <div class="text-center">
            <h1 id="city" class="fw-bold d-inline"></h1>
            <button id="favoriteBtn" class="btn btn-sm btn-warning ms-2 d-none"></button>
            <h2 id="temperature" class="display-1 fw-semibold"></h2>
        </div>
        <div class="text-center my-3">
            <div id="icon">
                <img src="https://openweathermap.org/img/wn/01d.png" alt="Icône" id="weatherIcon" style="width: 100px;">
            </div>
            <div id="description" class="text-capitalize mt-2 fs-5"></div>
        </div>
        <div class="container mt-4" id="forecast"></div>
        <div class="d-flex justify-content-around text-center mb-3">
            <div>
                <div class="text-uppercase small">Min</div>
                <div id="tempmin" class="fw-bold"></div>
            </div>
            <div>
                <div class="text-uppercase small">Max</div>
                <div id="tempmax" class="fw-bold"></div>
            </div>
        </div>
        <div class="text-center mb-2">
            <div class="text-uppercase small">Vent</div>
            <div id="wind" class="fw-bold"></div>
            <div id="pluie"></div>
        </div>

    </div>








    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
